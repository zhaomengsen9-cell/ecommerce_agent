[project]
name = "frappe-ecommerce-agent"
version = "0.1.0"
description = "MCP-connected Deep Agents framework for a Frappe/ERPNext ecommerce sandbox."
requires-python = ">=3.11"
dependencies = [
  "deepagents>=0.6.12",
  "fastapi>=0.115.0",
  "langchain-core>=1.5.1",
  "langchain-mcp-adapters>=0.3.1",
  "langchain-deepseek>=0.1.4",
  "langchain-openai>=1.4.1",
  "mcp>=1.28.1",
  "pydantic>=2.7.0",
  "psycopg[binary]>=3.2.0",
  "requests>=2.34.2",
  "sqlalchemy>=2.0.0",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
rag = [
  "chromadb>=0.5.0",
  "langchain-chroma>=0.1.4",
]

[project.scripts]
ecommerce-agent = "ecommerce_agent.agents.main_agent:main"
ecommerce-agent-mcp = "ecommerce_agent.mcp_server.erp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ecommerce_agent"]
